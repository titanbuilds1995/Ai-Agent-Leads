# nginx site for the Titan webhook. Copy to /etc/nginx/sites-available/titan, symlink into sites-enabled,
# replace __WEBHOOK_HOST__ with the DNS name you point at the VPS, then run certbot (deploy/DEPLOY.md step 3).
server {
    listen 80;
    server_name __WEBHOOK_HOST__;

    # certbot --nginx rewrites this block to redirect to 443 and adds the TLS block.
    location /twilio/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
    }
    location / { return 404; }
}
