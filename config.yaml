# Every number Rodrigo may want to change lives here. Code never hardcodes these.

operator:
  sender_name: "Charles Grant"         # sends and signs the outreach (Rodrigo, 2026-10-24)
  sender_title: "Junior Acquisitions Agent"
  # Exact signature under every email (Rodrigo, 2026-10-24). No opt-out line: it makes a personal email read as marketing.
  signature_lines:
    - "Charles Grant"
    - "Junior Acquisitions Agent"
    - "Titan Realty Investments"
    - "Office Line: +1 (561) 405 7379"
  principal_name: "Rodrigo Gayoso"     # approves every price; named only when an agent asks who decides
  company: "Titan Realty Investments LLC"
  company_short: "Titan Realty"
  sender_phone: "+15614057379"          # (561) 405-7379, the Titan main line (docs/style guide §1)
  reply_to_email: "Charles@titanrealtyinvestments.com"
  mailing_address: "13075 Marcella Blvd, Loxahatchee, FL"
  sender_email: "Charles@titanrealtyinvestments.com"   # the Gmail mailbox that holds the drafts and sends (Rodrigo, 2026-10-23)

market:
  state: "FL"
  counties: ["Miami-Dade", "Broward", "Palm Beach"]
  property_types: ["single_family", "townhouse", "multi_family", "land"]   # multi_family = duplex–quadplex
  max_units: 4
  price_min: 150000
  price_max: 750000
  lookback_days: 30            # only used with ingest.homeharvest.scope: window (or require_recent: true)
  min_sqft: 500
  # Never pursue these (Rodrigo, 2026-10-24): bank-owned/REO and short sales. Detected in the remarks and status.
  exclude_flags: ["reo", "short_sale", "auction", "not_a_home", "no_assignment", "no_inspection"]   # auction = trustee/bankruptcy/auction sales (no conversation to have); not_a_home = boat slips, parking, storage, timeshares, lot rent

formula:
  # Share of ARV to pay comes from what investors actually paid in that ZIP (data/market_ratios.csv, from the WhatsApp
  # sales engine's deed-record flips). arv_multiplier is the fallback when no market ratio applies (land, thin data).
  ratio_source: "market"          # market | flat
  market_ratio_percentile: "median"   # p25 (conservative) | median | p75
  market_ratios_file: "data/market_ratios.csv"
  arv_multiplier: 0.70
  assignment_fee: 15000
  min_spread_pct: 15           # list must be at least this % above MAO to be a "deal" worth working... see ranking
  offer_below_mao_pct: 2       # INTERNAL screening only: the engine never sends a number; Rodrigo approves every offer (approve-offer)
  counter_accept_within_pct: 10   # INTERNAL: flags a counter as "close" in the review summary; never auto-accepts
  emd: 5000
  close_days: 14

repairs:
  # $/sqft by tier, applied to living sqft (land uses a flat per-acre clearing allowance)
  cosmetic: 15
  moderate: 35
  heavy: 60
  gut: 95
  default_tier: "moderate"
  land_per_acre: 2500
  min_repair_budget: 10000

valuation:
  comps_source: "homeharvest"   # sold comps: homeharvest (free) or apify (Zillow sold actor)
  comp_radius_miles: 0.5
  comp_sqft_tolerance_pct: 25
  comp_months: 12               # Rodrigo's comps rule: last 12 months (the engine and the numbers snapshot use the same window; newer sales rank higher)
  min_comps: 3
  max_arv_to_list: 1.75          # ARV above 1.75× the ask is flagged *_suspect (bad comps/sqft), never HOT, never "close to asking"
  fallback_radius_miles: 1.0
  condition_adjustment_pct:     # applied to comp-derived ARV to reflect finished condition expectation
    cosmetic: 0
    moderate: 0
    heavy: 0
    gut: 0
  land_arv_per_acre_default: 150000

comps:
  # COMP ENGINE (Rodrigo, 2026-10-28: "the comps are just incorrect"; titan/comps_engine.py). Same product only (a townhouse in
  # an HOA never comps against detached pool houses), waterfront and new-build sales out unless we are one, $/sf outliers out,
  # beds / year built / lot matched when known, similarity-ranked; renovated sales set the exit; split layouts and unpermitted
  # work discount it. Radius / size / year / beds below are STARTING values: data/comps_tuning.json (written by the daily loop)
  # overrides them when real sales say so.
  tuning_file: "data/comps_tuning.json"
  radius_miles: 0.5
  fallback_radius_miles: 1.0
  max_radius_miles: 2.0
  sqft_tol_pct: 25
  relaxed_sqft_tol_pct: 35
  beds_tol: 1
  year_tol: 30
  lot_ratio: [0.4, 2.5]
  ppsf_band: [0.5, 1.7]            # keep sales within 0.5x..1.7x the group's median $/sf
  min_price: 30000                 # below this a "sale" is a deed transfer, not a price
  want: 10
  layout_discount_pct: {split: 8, unpermitted: 7, sqft_suspect: 5}
  loop:                            # the daily loop (titan/comps_loop.py; run-daily step "comps", `make comps-loop`)
    enabled: true
    tests_per_zip: 25              # back-test sample: sold homes per ZIP pool valued from the other sales in the pool
    max_zips: 40
    tune_seconds: 240
    min_tests: 150                 # adopt new settings only on at least this many test sales...
    min_gain_pts: 0.3              # ...and a clear gain in median error (percentage points)
    change_pct: 10                 # log (and post on the card) an ARV that moved this much
    claude_reviews_per_day: 15     # paid API, pennies each: the comp sets behind the houses Rodrigo is working, oldest review first
    review_every_days: 7
    post_changes: true             # one short comment on the lead card when its ARV moved

targeting:
  # Ideal seller: sitting 60+ days, best with price drops / back on market. Also: fresh listings whose price already works.
  sitting_min_dom: 60
  fresh_max_dom: 14
  fresh_price_within_pct: 5      # fresh listing counts as a deal when list ≤ internal high × (1 + this/100), on real comps

ranking:
  sitting_hot_max_list_over_mao_pct: 40    # SITTING lane: conversation first, so a wider gap is still worth asking about
  sitting_warm_max_list_over_mao_pct: 60
  hot_min_motivation: 65
  hot_max_list_over_mao_pct: 20
  warm_min_motivation: 50
  warm_max_list_over_mao_pct: 35
  score_min_for_valuation: 0      # value every kept listing (cheap; comps cached per ZIP) so fresh good prices are found
  arv_methods_for_hot_warm: ["comps", "comps_wide", "estimate"]   # *_suspect (ARV > max_arv_to_list × ask) is never HOT/WARM   # a guessed ARV (land_default, list_price) can only be COLD

scoring:
  # Cost rule (Rodrigo, 2026-10-24): use what is free or already paid for before spending money.
  provider: "claude_code"          # claude_code = `claude -p` on the Mac, billed to the Claude Code plan | api = pay per token | rules
  claude_code_model: "sonnet"
  claude_code_batch_size: 20       # listings per `claude -p` call (fewer calls = less plan usage)
  allow_paid_api: false            # true = fall back to the paid API when the Claude Code CLI is missing
  communication_provider: "api"    # Rodrigo, 2026-10-27: card rewrites, answers, reply drafts, first emails and reply reading run on
                                   # the paid API all the time (pennies per card), never on the Mac's Claude login. Scoring stays on the plan.
  paid_fallback_when_login_fails: true    # and if communication_provider is ever set back to claude_code: paid API when BOTH logins are refused
  model: "claude-sonnet-5-5"       # only used by provider: api
  max_claude_calls_per_run: 1500   # cost cap (~$0.005 each); target lanes first, the rest catch up on later runs
  effort: "low"
  max_tokens: 1024
  # Weighted signals (max contribution each). Rules fallback and the LLM prompt both use these.
  signals:
    cash_only: 18
    as_is: 14
    needs_work: 12
    motivated_seller: 15
    bring_all_offers: 12
    price_reduced: 10
    estate_probate: 14
    life_event: 10
    tenant_occupied: 6
    investor_special: 12
    distress_status: 16
    seller_financing: 5
    code_violations: 10
    damage: 12
    vacant: 8
    dom_over_60: 8
    two_plus_cuts: 10
    back_on_market: 8
    expired_relisted: 6
  negatives:
    fully_renovated: -20
    turnkey: -15
    multiple_offers: -20
    highest_and_best: -20

outreach:
  mode: "DRAFT_FOR_APPROVAL"       # DRAFT_FOR_APPROVAL | AUTO_SEND_FIRST_TOUCH | FULL_AUTO
  # Conversation first (Rodrigo, 2026-10-24): the first message opens a conversation about seller flexibility; no price,
  # percentage or range ever goes out without Rodrigo approving it for that house (`titan.cli approve-offer`).
  strategy: "CONVERSATION_FIRST"
  near_ask_within_pct: 5           # may say "asking isn't too far from where we'd need to be" only when list ≤ internal high × (1 + this/100)
  max_auto_questions: 2            # after this many back-and-forths, stop and bring the lead to Rodrigo
  channel: "EMAIL_FIRST"           # SMS_FIRST | EMAIL_FIRST | BOTH. Email until Twilio A2P is approved (Rodrigo, 2026-10-23)
  daily_email_cap: 30              # Rodrigo: at least 25 a day (2026-10-24)
  max_properties_per_email: 2      # more listings in one email reads like mass mail (protocol §8)
  daily_sms_cap: 25
  agent_cooldown_days: 7
  max_unanswered_sms: 3
  sms_window: {start_hour: 9, end_hour: 18, weekdays_only: true, timezone: "America/New_York"}
  gmail_review_label: "Titan/Review"
  # Approvals on Asana (Rodrigo, 2026-10-24): each email is a card (picture + text) on the board below. Feedback comments are
  # rewritten on the card; Approved cards go out from Charles's Gmail inside send_window, per_tick at a time, at varied times.
  approval: "asana"                 # asana | gmail_drafts
  asana:
    project: "1219847112999805"     # Titan Outreach — Email Approvals
    to_review: "1219847260413153"
    approved: "1219847113107056"
    sent: "1219847113142042"
    skip: "1219846985445292"
    updates_project: "1219837397052431"   # Titan Lead Engine — Claude Updates (engine alarms go to Needs Rodrigo)
    needs_rodrigo: "1219837590904714"
    # Titan Warm Leads (Rodrigo, 2026-10-28): answered leads he moved off the approvals board by hand. The engine reads their
    # comments and keeps them in these columns (titan/warm_leads.py); the answer sits on the card itself (NEXT EMAIL) and a
    # "send it" comment sends it from there (there is no Approved column on this board).
    warm_leads:
      project: "1219996826543058"
      needs_me: "1219997042008635"
      needs_revision: "1219997049297604"
      waiting: "1219996909805061"     # Waiting on the agent
      offer_out: "1219996806307425"
      closed: "1219997042127935"
    per_tick: 5                     # emails per 20-minute round (Rodrigo, 2026-11-02: approved cards sat too long at 2)
    send_window: {start: "08:30", end: "17:30", timezone: "America/New_York", days: [0, 1, 2, 3, 4, 5, 6]}
  # Second touch (Rodrigo, 2026-11-02): a "Good morning" follow-up in the same thread to every agent who never answered the
  # first email. `titan.cli follow-ups` puts each one on the lead's own card as NEXT EMAIL, in Needs Me (--approve: Approved when he said send).
  follow_up:
    after_days: 3                  # first email at least this old before a follow-up is drafted
    max_per_run: 25
  email_min_confidence: "medium"   # high | medium | low — minimum enrichment confidence to email
  handoff_email_wait_business_days: 2
  terms:
    as_is: true
    inspection_contingency: true      # we always keep an inspection period; never promise to waive it
    inspection_days: 7
    buyer_pays_closing: true
    proof_of_funds: "available on request"
  # Voice. The style guide is injected into every Claude drafting prompt; the examples below are verbatim
  # agent/office-facing emails Rodrigo sent (docs/style/style_examples.md §C and §F) used as few-shot.
  protocol: "docs/style/OUTREACH_PROTOCOL.md"      # Rodrigo's outreach protocol, injected into every first-touch / revise prompt
  voice_protocol: "docs/style/VOICE_PROTOCOL.md"   # junior acquisitions voice: "I" for actions, "we" for criteria
  style_guide: "docs/style/RODRIGO_WRITING_STYLE_GUIDE.md"   # tone reference (replies, written offer)
  example_emails:
    - |
      Good morning,

      This is Rodrigo with Titan Realty Investments. I spoke earlier today with a woman at (786) 780-5923 about the apartment building at 4227 NW 5th St. We're investors buying multifamily properties in South Florida, and I told her we'd like to make an offer. She asked me to send it to this email.

      To make sure our offer is accurate, could you share a few basic numbers on the property? You don't need to send any internal documents. Rough figures are fine.

      Once I have these, I can put together a firm offer quickly. You can also call or text me at (561) 405-7379 if that's easier.

      Thank you, and I look forward to hearing from you.

      Best regards,
    - |
      Good afternoon,

      This is Rodrigo with Titan Realty. I called one of your numbers earlier and spoke with a member of your staff, who was kind enough to pass along your email addresses.

      We're actively acquiring multifamily properties in the Miami area, and I wanted to ask whether you have any assets you'd be open to selling right now. If so, I'd be happy to put together an offer for you.

      I look forward to hearing from you both.

      Best regards,
    - |
      Mr. Wenzel,

      Rodrigo here with Titan Realty, we spoke just now about one of your commercial properties in Hialeah, I reached out to you because we are looking to acquire buildings like this in the area.

      You instructed me to email you so you could forward me the address of the building you're looking to sell.

      Could you please share the address and any related details to the building. Rent roll, expenses, etc.

      Thank you!
    - |
      Hey Nicholas,

      At this point, the asking price is nowhere near where we would purchase. Our cash offer would be closer to $1,650,000.

      The main reason is the tax reassessment. The seller has owned the property since 2012, so it's being taxed on a capped value of about $866,000. Once we buy it, it gets reassessed closer to the purchase price. Add vacancy and management, and the expenses become closer to $90,000 for us. The numbers just don't work at the asking price.

      Would the seller consider some seller financing?
      Best,
    - |
      Hey Jonathan,

      This is Rodrigo, I am the principal of Titan Realty Investments, I specialize in finding off market opportunities for investors like yourself. I found you because I noticed that you have purchased 2 properties in the El Portal area that are similar to a property that I have available.

      I was reaching out to you because I know if you're still buying you would be very interested. Could you please give me a call at (561) 405-7379 so I can walk you through the property that we have.

      Look forward to hearing from you!

      Best,

enrichment:
  office_line_min_agents: 3
  smtp_verify: true
  smtp_timeout_seconds: 8
  http_timeout_seconds: 15
  dbpr_enabled: true
  portals: ["realtor.com", "zillow.com", "homes.com"]
  pattern_min_known_emails: 2     # how many known emails at a brokerage before guessing a pattern

ingest:
  # Rodrigo, 2026-10-26: PAUSED. No new listings for the agent-email strategy; we email and make offers on the ones we have.
  # Set to false to start scraping new listings again. Scoring, valuation, enrichment and outreach keep running.
  paused: true
  # Which sources run each morning. homeharvest = free Realtor.com scraper (runs on the Mac; realtor.com blocks cloud IPs).
  # Add "realtor" / "zillow" to also run the paid Apify actors.
  sources: ["homeharvest", "mls", "redfin"]
  homeharvest:
    scope: "all_active"          # all_active: every active listing (free; targeting picks who we contact) | window: last lookback_days only
    limit_per_query: 3000        # per county × price band query; a full result is logged as "capped"
    price_band_width: 50000      # split each county search into $50k price bands so no query hits the limit
    extra_property_data: true    # agent email/phones + price history; one extra request per 50 listings
    proxy: null                  # e.g. "http://user:pass@host:port" if realtor.com starts blocking the Mac
  apify:
    realtor_actor: "epctex/realtor-scraper"
    zillow_actor: "maxcopell/zillow-scraper"
    sold_actor: "maxcopell/zillow-scraper"     # same actor family supports sold listings via status filter
    timeout_seconds: 900
    max_items_per_actor: 3000
  redfin_csv_dir: "raw/redfin"
  mls_csv_dir: "raw/mls"          # drop Matrix CSV exports here (hot sheets or full exports)
  scrape_health_min_ratio: 0.5     # warn when today's count < ratio × 7-day median

report:
  hour_et: 7
  max_hot_leads: 10
  end_of_day:                      # Rodrigo, 2026-10-29: a report of the day's activity every evening (titan/end_of_day.py)
    hour_et: 19                    # sent by the first check-replies run after 7pm ET (no cron change needed)
    daily_goal: 25                 # leads emailed or talked to per day

llm_pricing_per_mtok:              # USD, used for the cost counter
  claude-sonnet-5-5: {input: 2.0, output: 10.0}
  claude-opus-5-5: {input: 4.0, output: 20.0}
  claude-haiku-5-5: {input: 0.10, output: 0.50}

paths:
  db: "titan_leads.db"
  logs: "logs"
  reports: "reports"
  raw: "raw"

# THE TRUST LADDER (Rodrigo, 2026-10-26; titan/learning.py). Every card decision is recorded; his comments become the
# knowledge base injected into every drafting prompt. A stage unlocks only when its rate clears the bar AND Rodrigo drags the
# "⚙ Autopilot" control card to Approved (dragging it out turns it off; the engine turns it off itself under pause_below).
autonomy:
  first_touch:                     # stage 2: first emails go out on their own
    window: 30                     # judge on his last 30 decided first-email cards
    min_decided: 30
    unlock_rate: 0.80              # approved without changing a word (skips and edits count against)
    pause_below: 0.65
    veto_hours: 3                  # an untouched card waits this long in To Review before autopilot moves it to Approved
  reply:                           # stage 3: Charles drafts every answer as a reply card (titan/replies/writer.py); auto-send comes after this gate
    window: 20
    min_decided: 20
    unlock_rate: 0.85
  ranges:                          # stage 4: ranges go out on their own (measured on approve-offer numbers vs internal range)
    window: 10
    min_decided: 10
    unlock_rate: 0.80
  knowledge: {max_lessons: 30, max_examples: 3}

# COMMERCIAL SCREEN FOR THE 1031 BUYER (Rodrigo, 2026-11-08; titan/commercial/). LoopNet is the only source (Apify actor,
# the account already pays for Apify). Every number the buyer box depends on lives here, nothing is hardcoded.
commercial:
  enabled: true
  tag: "1031-buyer"
  buyer_name: "1031 Exchange Buyer"     # printed on the buyer brief (make buyer-brief); put the buyer's name here when he wants it on paper
  buyer_box:
    price_min: 3500000
    price_max: 8000000
    cap_min: 8.0                     # hard floor: a stated cap under this is never in the box (a missing cap is NEEDS-OM, not excluded)
    sweet_spot_max: 6000000          # $3.5M–$6M weighs highest; above this is "reach" tier (~80% LTV on $1.6M equity at $8M)
    equity: 1600000
    target_cap: 8.0                  # the OFFER ANCHOR is the price at which stated NOI yields this cap
    state: "FL"
    south_florida: ["Miami-Dade", "Broward", "Palm Beach"]   # score the rest of Florida slightly higher (8% rarely trades here)
    # Asset types IN (existing, cash-flowing). Land, development sites and businesses-only are OUT (see loopnet.ASSET_MAP).
    asset_types_in: ["nnn", "retail", "hotel", "industrial", "office", "multifamily", "medical"]
    multifamily_min_units: 5
    include_undisclosed_price: false  # "Price Not Disclosed" rows stay in the master (flagged) but out of the Top 25 and the broker list
    # Rodrigo, 2026-11-09: no further than 45 minutes from a commercial airport (titan/commercial/airports.py; straight-line miles ×
    # minutes_per_mile ≈ drive time), and quality: building class C or better, no distressed / below-C-area language
    # (titan/commercial/quality.py). LoopNet has no neighborhood class, so the text is the only signal for that part.
    airport_max_minutes: 45
    airport_minutes_per_mile: 1.4
    min_building_class: "C"
    min_year_built: null             # e.g. 1980 to flag older buildings as "watch"
  scoring:                           # weights add up to 100 (titan/commercial/scoring.py explains each)
    cap: 25
    dom_and_cuts: 12
    motivation: 12
    lease_quality: 20
    brokerage: 8
    asset_fit: 10
    price_band: 8
    region: 5
    cap_mismatch_bps: 50             # back-solved cap (NOI / price) off the stated cap by more than this = flag
    suspect_ppsf_multiple: 2.0       # $/SF above this × the county+type median (4+ peers) = SUSPECT
    min_expense_ratio_non_nnn: 0.30  # implied expenses under this share of gross on a non-NNN asset = SUSPECT
  loopnet:
    actor: "memo23/loopnet-scraper-ppe"   # $1.50 per 1,000 search rows + $0.01 per full detail sheet (2026-11-08 store price)
    # One LoopNet search per asset family, filtered by LoopNet itself to the price box; the cap floor is applied by the actor
    # (listings that show no cap are kept and handled as NEEDS-OM).
    search_urls:
      retail: "https://www.loopnet.com/search/retail-space/fl/for-sale/"
      shopping_center: "https://www.loopnet.com/search/shopping-centers/fl/for-sale/"
      office: "https://www.loopnet.com/search/office-buildings/fl/for-sale/"
      medical: "https://www.loopnet.com/search/medical-offices/fl/for-sale/"
      industrial: "https://www.loopnet.com/search/industrial-properties/fl/for-sale/"
      multifamily: "https://www.loopnet.com/search/multifamily/fl/for-sale/"
      hotel: "https://www.loopnet.com/search/hotels/fl/for-sale/"
    max_items_per_search: 2000
    more_results: true               # LoopNet caps one search at 750 rows; the actor splits into price bands past that
    details: true                    # second pass: full property sheet for in-box listings (NOI, occupancy, tenancy, lease, DOM)
    detail_budget_usd: 4.0           # stop fetching sheets past this spend per run (free Apify plan = $5 a month)
    timeout_seconds: 1800
  documents:
    download: true                   # public OM / brochure / flyer PDFs → data/listings/<listing_id>/ (gated ones are only recorded)
    dir: "data/listings"
    max_mb: 25
  outputs:
    dir: "reports/commercial"
    top_n: 25
  asana:
    project: "1220324280677489"      # "Titan 1031 · Commercial (LoopNet)" board (created 2026-11-08; sections Top tier / Needs OM / Suspect / Contacted / Skip are found by name)
    push_top_n: 25                   # CLEAN top-tier cards
    needs_om_n: 40                   # OM-request task list
  # Commercial send pace (Rodrigo, 2026-11-09: "shorten the time frame ... but not too too fast"): OM-request cards first, then the
  # no-cap blast queue (data/commercial_queue/<date>.json, `make commercial-blast`), every 20-minute round inside the send window.
  outreach:
    per_round: 25                    # commercial emails per round (cards + queue)
    daily_cap: 450                   # per day, separate from the residential daily_email_cap
    queue_dir: "data/commercial_queue"
  schedule: "manual"                 # manual | daily. daily = run-daily step "commercial" (costs Apify credit every morning)
  report_to_email: true              # the morning diff goes to REPORT_TO when Gmail is connected
  # Rodrigo, 2026-11-08: "I'm a visual guy". After every pull a Titan-style HTML email with a photo card per listing and a
  # "why this fits" line goes to REPORT_TO (the same layout he forwards to the investor), each card linking to the site.
  email:
    enabled: true
    max_cards: 40                    # cards in the email (in-box listings, hot to cold; the rest are on the site)
    photo_size: "116"                # LoopNet image size token in the photo URL ({s}); 112 is the smaller one
  # The investor dashboard: a "1031" page on the Vercel site (dashboard/public/1031.html) fed by titan/deals.json in the same
  # Blob store as the snapshot (titan/commercial/site.py). Private view = dashboard password (everything); investor view = the
  # share key (DEALS_SHARE_KEY in .env and on Vercel) and only the investor columns, no internal numbers.
  site:
    url: ""                          # e.g. https://titan-dashboard.vercel.app (the email links point here; blank = LoopNet links)
    investor_columns: ["Good fit", "In touch with the agent", "Books received", "Offer out"]
