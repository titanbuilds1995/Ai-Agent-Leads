# Every number Rodrigo may want to change lives here. Code never hardcodes these.

operator:
  sender_name: "Charles Grant"         # sends and signs the outreach (Rodrigo, 2026-10-24)
  sender_title: "Junior Acquisitions Agent"
  # Exact signature under every email (Rodrigo, 2026-10-24). No opt-out line: it makes a personal email read as marketing.
  signature_lines:
    - "Charles Grant"
    - "Junior Acquisitions Agent"
    - "Titan Realty Investments"
    - "Office Line: +1 (561) 405 7379"
  principal_name: "Rodrigo Gayoso"     # approves every price; named only when an agent asks who decides
  company: "Titan Realty Investments LLC"
  company_short: "Titan Realty"
  sender_phone: "+15614057379"          # (561) 405-7379, the Titan main line (docs/style guide §1)
  reply_to_email: "Charles@titanrealtyinvestments.com"
  mailing_address: "13075 Marcella Blvd, Loxahatchee, FL"
  sender_email: "Charles@titanrealtyinvestments.com"   # the Gmail mailbox that holds the drafts and sends (Rodrigo, 2026-10-23)

market:
  state: "FL"
  counties: ["Miami-Dade", "Broward", "Palm Beach"]
  property_types: ["single_family", "townhouse", "multi_family", "land"]   # multi_family = duplex–quadplex
  max_units: 4
  price_min: 150000
  price_max: 750000
  lookback_days: 30            # only used with ingest.homeharvest.scope: window (or require_recent: true)
  min_sqft: 500
  # Never pursue these (Rodrigo, 2026-10-24): bank-owned/REO and short sales. Detected in the remarks and status.
  exclude_flags: ["reo", "short_sale", "not_a_home"]   # not_a_home = boat slips, parking spaces, storage, timeshares, lot rent

formula:
  # Share of ARV to pay comes from what investors actually paid in that ZIP (data/market_ratios.csv, from the WhatsApp
  # sales engine's deed-record flips). arv_multiplier is the fallback when no market ratio applies (land, thin data).
  ratio_source: "market"          # market | flat
  market_ratio_percentile: "median"   # p25 (conservative) | median | p75
  market_ratios_file: "data/market_ratios.csv"
  arv_multiplier: 0.70
  assignment_fee: 15000
  min_spread_pct: 15           # list must be at least this % above MAO to be a "deal" worth working... see ranking
  offer_below_mao_pct: 2       # INTERNAL screening only: the engine never sends a number; Rodrigo approves every offer (approve-offer)
  counter_accept_within_pct: 10   # INTERNAL: flags a counter as "close" in the review summary; never auto-accepts
  emd: 5000
  close_days: 14

repairs:
  # $/sqft by tier, applied to living sqft (land uses a flat per-acre clearing allowance)
  cosmetic: 15
  moderate: 35
  heavy: 60
  gut: 95
  default_tier: "moderate"
  land_per_acre: 2500
  min_repair_budget: 10000

valuation:
  comps_source: "homeharvest"   # sold comps: homeharvest (free) or apify (Zillow sold actor)
  comp_radius_miles: 0.5
  comp_sqft_tolerance_pct: 25
  comp_months: 6
  min_comps: 3
  fallback_radius_miles: 1.0
  condition_adjustment_pct:     # applied to comp-derived ARV to reflect finished condition expectation
    cosmetic: 0
    moderate: 0
    heavy: 0
    gut: 0
  land_arv_per_acre_default: 150000

targeting:
  # Ideal seller: sitting 60+ days, best with price drops / back on market. Also: fresh listings whose price already works.
  sitting_min_dom: 60
  fresh_max_dom: 14
  fresh_price_within_pct: 5      # fresh listing counts as a deal when list ≤ internal high × (1 + this/100), on real comps

ranking:
  sitting_hot_max_list_over_mao_pct: 40    # SITTING lane: conversation first, so a wider gap is still worth asking about
  sitting_warm_max_list_over_mao_pct: 60
  hot_min_motivation: 65
  hot_max_list_over_mao_pct: 20
  warm_min_motivation: 50
  warm_max_list_over_mao_pct: 35
  score_min_for_valuation: 0      # value every kept listing (cheap; comps cached per ZIP) so fresh good prices are found
  arv_methods_for_hot_warm: ["comps", "comps_wide", "estimate"]   # a guessed ARV (land_default, list_price) can only be COLD

scoring:
  # Cost rule (Rodrigo, 2026-10-24): use what is free or already paid for before spending money.
  provider: "claude_code"          # claude_code = `claude -p` on the Mac, billed to the Claude Code plan | api = pay per token | rules
  claude_code_model: "sonnet"
  claude_code_batch_size: 20       # listings per `claude -p` call (fewer calls = less plan usage)
  allow_paid_api: false            # true = fall back to the paid API when the Claude Code CLI is missing
  model: "claude-sonnet-5-5"       # only used by provider: api
  max_claude_calls_per_run: 1500   # cost cap (~$0.005 each); target lanes first, the rest catch up on later runs
  effort: "low"
  max_tokens: 1024
  # Weighted signals (max contribution each). Rules fallback and the LLM prompt both use these.
  signals:
    cash_only: 18
    as_is: 14
    needs_work: 12
    motivated_seller: 15
    bring_all_offers: 12
    price_reduced: 10
    estate_probate: 14
    life_event: 10
    tenant_occupied: 6
    investor_special: 12
    distress_status: 16
    seller_financing: 5
    code_violations: 10
    damage: 12
    vacant: 8
    dom_over_60: 8
    two_plus_cuts: 10
    back_on_market: 8
    expired_relisted: 6
  negatives:
    fully_renovated: -20
    turnkey: -15
    multiple_offers: -20
    highest_and_best: -20

outreach:
  mode: "DRAFT_FOR_APPROVAL"       # DRAFT_FOR_APPROVAL | AUTO_SEND_FIRST_TOUCH | FULL_AUTO
  # Conversation first (Rodrigo, 2026-10-24): the first message opens a conversation about seller flexibility; no price,
  # percentage or range ever goes out without Rodrigo approving it for that house (`titan.cli approve-offer`).
  strategy: "CONVERSATION_FIRST"
  near_ask_within_pct: 5           # may say "asking isn't too far from where we'd need to be" only when list ≤ internal high × (1 + this/100)
  max_auto_questions: 2            # after this many back-and-forths, stop and bring the lead to Rodrigo
  channel: "EMAIL_FIRST"           # SMS_FIRST | EMAIL_FIRST | BOTH. Email until Twilio A2P is approved (Rodrigo, 2026-10-23)
  daily_email_cap: 30              # Rodrigo: at least 25 a day (2026-10-24)
  daily_sms_cap: 25
  agent_cooldown_days: 7
  max_unanswered_sms: 3
  sms_window: {start_hour: 9, end_hour: 18, weekdays_only: true, timezone: "America/New_York"}
  gmail_review_label: "Titan/Review"
  # Approvals on Asana (Rodrigo, 2026-10-24): each email is a card (picture + text) on the board below. Feedback comments are
  # rewritten on the card; Approved cards go out from Charles's Gmail inside send_window, per_tick at a time, at varied times.
  approval: "asana"                 # asana | gmail_drafts
  asana:
    project: "1219847112999805"     # Titan Outreach — Email Approvals
    to_review: "1219847260413153"
    approved: "1219847113107056"
    sent: "1219847113142042"
    skip: "1219846985445292"
    per_tick: 2                     # emails per 20-minute round
    send_window: {start: "08:30", end: "17:30", timezone: "America/New_York", days: [0, 1, 2, 3, 4, 5, 6]}
  email_min_confidence: "medium"   # high | medium | low — minimum enrichment confidence to email
  handoff_email_wait_business_days: 2
  terms:
    as_is: true
    inspection_contingency: true      # we always keep an inspection period; never promise to waive it
    inspection_days: 7
    buyer_pays_closing: true
    proof_of_funds: "available on request"
  # Voice. The style guide is injected into every Claude drafting prompt; the examples below are verbatim
  # agent/office-facing emails Rodrigo sent (docs/style/style_examples.md §C and §F) used as few-shot.
  style_guide: "docs/style/RODRIGO_WRITING_STYLE_GUIDE.md"
  example_emails:
    - |
      Good morning,

      This is Rodrigo with Titan Realty Investments. I spoke earlier today with a woman at (786) 780-5923 about the apartment building at 4227 NW 5th St. We're investors buying multifamily properties in South Florida, and I told her we'd like to make an offer. She asked me to send it to this email.

      To make sure our offer is accurate, could you share a few basic numbers on the property? You don't need to send any internal documents. Rough figures are fine.

      Once I have these, I can put together a firm offer quickly. You can also call or text me at (561) 405-7379 if that's easier.

      Thank you, and I look forward to hearing from you.

      Best regards,
    - |
      Good afternoon,

      This is Rodrigo with Titan Realty. I called one of your numbers earlier and spoke with a member of your staff, who was kind enough to pass along your email addresses.

      We're actively acquiring multifamily properties in the Miami area, and I wanted to ask whether you have any assets you'd be open to selling right now. If so, I'd be happy to put together an offer for you.

      I look forward to hearing from you both.

      Best regards,
    - |
      Mr. Wenzel,

      Rodrigo here with Titan Realty, we spoke just now about one of your commercial properties in Hialeah, I reached out to you because we are looking to acquire buildings like this in the area.

      You instructed me to email you so you could forward me the address of the building you're looking to sell.

      Could you please share the address and any related details to the building. Rent roll, expenses, etc.

      Thank you!
    - |
      Hey Nicholas,

      At this point, the asking price is nowhere near where we would purchase. Our cash offer would be closer to $1,650,000.

      The main reason is the tax reassessment. The seller has owned the property since 2012, so it's being taxed on a capped value of about $866,000. Once we buy it, it gets reassessed closer to the purchase price. Add vacancy and management, and the expenses become closer to $90,000 for us. The numbers just don't work at the asking price.

      Would the seller consider some seller financing?
      Best,
    - |
      Hey Jonathan,

      This is Rodrigo, I am the principal of Titan Realty Investments, I specialize in finding off market opportunities for investors like yourself. I found you because I noticed that you have purchased 2 properties in the El Portal area that are similar to a property that I have available.

      I was reaching out to you because I know if you're still buying you would be very interested. Could you please give me a call at (561) 405-7379 so I can walk you through the property that we have.

      Look forward to hearing from you!

      Best,

enrichment:
  office_line_min_agents: 3
  smtp_verify: true
  smtp_timeout_seconds: 8
  http_timeout_seconds: 15
  dbpr_enabled: true
  portals: ["realtor.com", "zillow.com", "homes.com"]
  pattern_min_known_emails: 2     # how many known emails at a brokerage before guessing a pattern

ingest:
  # Which sources run each morning. homeharvest = free Realtor.com scraper (runs on the Mac; realtor.com blocks cloud IPs).
  # Add "realtor" / "zillow" to also run the paid Apify actors.
  sources: ["homeharvest", "mls", "redfin"]
  homeharvest:
    scope: "all_active"          # all_active: every active listing (free; targeting picks who we contact) | window: last lookback_days only
    limit_per_query: 3000        # per county × price band query; a full result is logged as "capped"
    price_band_width: 50000      # split each county search into $50k price bands so no query hits the limit
    extra_property_data: true    # agent email/phones + price history; one extra request per 50 listings
    proxy: null                  # e.g. "http://user:pass@host:port" if realtor.com starts blocking the Mac
  apify:
    realtor_actor: "epctex/realtor-scraper"
    zillow_actor: "maxcopell/zillow-scraper"
    sold_actor: "maxcopell/zillow-scraper"     # same actor family supports sold listings via status filter
    timeout_seconds: 900
    max_items_per_actor: 3000
  redfin_csv_dir: "raw/redfin"
  mls_csv_dir: "raw/mls"          # drop Matrix CSV exports here (hot sheets or full exports)
  scrape_health_min_ratio: 0.5     # warn when today's count < ratio × 7-day median

report:
  hour_et: 7
  max_hot_leads: 10

llm_pricing_per_mtok:              # USD, used for the cost counter
  claude-sonnet-5-5: {input: 2.0, output: 10.0}
  claude-opus-5-5: {input: 4.0, output: 20.0}
  claude-haiku-5-5: {input: 0.10, output: 0.50}

paths:
  db: "titan_leads.db"
  logs: "logs"
  reports: "reports"
  raw: "raw"
